<template>
    <!-- PROPERTIES SECTION -->
    <lightning-card title="Properties" class="slds-m-top_medium">
        <div class="slds-p-around_medium">
            <div class="slds-grid slds-gutters slds-wrap slds-m-bottom_medium slds-grid_vertical-align-end">
                <div class="slds-col slds-size_1-of-5">
                    <lightning-combobox
                        label="Availability Status"
                        value={availabilityStatus}
                        options={statusOptions}
                        onchange={handleStatusChange}>
                    </lightning-combobox>
                </div>
                <div class="slds-col slds-size_1-of-5">
                    <lightning-combobox
                        label="Furnishing Status"
                        value={furnishingStatus}
                        options={furnishingOptions}
                        onchange={handleFurnishingChange}>
                    </lightning-combobox>
                </div>
                <div class="slds-col slds-size_1-of-5">
                    <lightning-input
                        type="number"
                        label="Min Price"
                        onchange={handleMinPrice}>
                    </lightning-input>
                </div>
                <div class="slds-col slds-size_1-of-5">
                    <lightning-input
                        type="number"
                        label="Max Price"
                        onchange={handleMaxPrice}>
                    </lightning-input>
                </div>
                <div class="slds-col slds-shrink">
                    <lightning-button
                        label="Search"
                        onclick={loadProperties}>
                    </lightning-button>
                </div>
            </div>
            
            <lightning-datatable
                key-field="id"
                data={properties}
                columns={columns}>
            </lightning-datatable>
            
            <lightning-button
                label="Previous"
                onclick={previousPage}
                disabled={disablePrevious}>
            </lightning-button>
            <lightning-button
                label="Next"
                onclick={nextPage}
                disabled={disableNext}>
            </lightning-button>
            <p class="slds-m-top_small">
                Page: {pageNumber}
                Total Records: {properties.length}
            </p>
        </div>
    </lightning-card>
</template>
