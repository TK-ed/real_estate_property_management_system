<template>
    <lightning-card title="Create Property">
        <div class="slds-p-around_medium">
            <div class="slds-grid slds-gutters slds-grid_vertical-align-end slds-wrap">

                <div class="slds-col">
                    <lightning-input
                        label="Property Name"
                        value={propertyName}
                        onchange={handleName}>
                    </lightning-input>
                </div>

                <div class="slds-col">
                    <lightning-input
                        label="Address"
                        value={address}
                        onchange={handleAddress}>
                    </lightning-input>
                </div>

                <div class="slds-col">
                    <lightning-input
                        type="number"
                        label="Rent"
                        value={rent}
                        onchange={handleRent}>
                    </lightning-input>
                </div>

                <template if:true={isPropertyCreated}>
                    <div class="slds-col">
                        <lightning-input
                            type="file"
                            label="Upload Image"
                            accept=".png,.jpg,.jpeg"
                            onchange={handleUploadFinished}>
                        </lightning-input>
                    </div>
                </template>

                <div class="slds-col slds-shrink">
                    <lightning-button
                        label="Create Property"
                        variant="brand"
                        onclick={createProperty}>
                    </lightning-button>
                </div>

                <div class="slds-col slds-shrink">
                    <lightning-button
                        label="Finish"
                        variant="success"
                        onclick={finishCreation}>
                    </lightning-button>
                </div>

            </div>
        </div>
    </lightning-card>

</template>
